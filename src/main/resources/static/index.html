                                                </div>
                                                {user.role === "ADMIN" && (
                                                    <input type="email" value={newOrder.customerEmail} onChange={e => setNewOrder({...newOrder, customerEmail: e.target.value})} placeholder="Customer Email (optional — defaults to your email)" className="w-full bg-slate-950/75 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm" />
                                                )}
                                                <div className="flex justify-end">
                                                    <button type="button" onClick={() => {
                                                        if (!newOrder.pickupAddress || !newOrder.pickupPincode || !newOrder.dropAddress || !newOrder.dropPincode) {
                                                            return showToast("Please fill in pickup & drop addresses and pincodes.", "error");
                                                        }
                                                        setOrderStep(2);
                                                    }} className="w-full sm:w-auto bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-sky-500/20 transition">
                                                        Next: Package Specs →
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {orderStep === 2 && (
                                            <div className="space-y-4 animate-float-in">
                                                <div className="flex flex-wrap items-center gap-2 text-xs">
                                                    <span className="text-slate-400 w-full sm:w-auto">Quick Box Presets:</span>
                                                    {[
                                                        { name: "📦 Small (20×15×10)", l: "20", b: "15", h: "10" },
                                                        { name: "📦 Medium (35×25×20)", l: "35", b: "25", h: "20" },
                                                        { name: "📦 Large (50×40×30)", l: "50", b: "40", h: "30" }
                                                    ].map(p => (
                                                        <button key={p.name} type="button" onClick={() => { setNewOrder({...newOrder, length: p.l, breadth: p.b, height: p.h}); setQuote(null); }}
                                                            className="bg-slate-900/90 hover:bg-indigo-600/80 border border-slate-700 px-3 py-1.5 rounded-xl transition">
                                                            {p.name}
                                                        </button>
                                                    ))}
                                                </div>

                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm font-mono-tech">
                                                    <input type="number" step="0.1" value={newOrder.length} onChange={e => { setNewOrder({...newOrder, length: e.target.value}); setQuote(null); }} placeholder="Length (cm)" className="bg-slate-950/75 border border-slate-700/80 rounded-xl px-3.5 py-2.5 focus:border-sky-400 focus:outline-none" />
                                                    <input type="number" step="0.1" value={newOrder.breadth} onChange={e => { setNewOrder({...newOrder, breadth: e.target.value}); setQuote(null); }} placeholder="Breadth (cm)" className="bg-slate-950/75 border border-slate-700/80 rounded-xl px-3.5 py-2.5 focus:border-sky-400 focus:outline-none" />
                                                    <input type="number" step="0.1" value={newOrder.height} onChange={e => { setNewOrder({...newOrder, height: e.target.value}); setQuote(null); }} placeholder="Height (cm)" className="bg-slate-950/75 border border-slate-700/80 rounded-xl px-3.5 py-2.5 focus:border-sky-400 focus:outline-none" />
                                                    <input type="number" step="0.1" value={newOrder.actualWeight} onChange={e => { setNewOrder({...newOrder, actualWeight: e.target.value}); setQuote(null); }} placeholder="Weight (kg)" className="bg-slate-950/75 border border-slate-700/80 rounded-xl px-3.5 py-2.5 focus:border-emerald-400 focus:outline-none" />
                                                </div>

                                                {liveBilledWeight && (
                                                    <div className="bg-slate-950/80 border border-indigo-500/30 p-3.5 rounded-2xl flex flex-wrap justify-between items-center text-xs gap-2 animate-float-in">
                                                        <span>Volumetric: <strong className="text-sky-300 font-mono-tech">{liveVolWeight || "0.00"} kg</strong></span>
                                                        <span>Actual: <strong className="text-indigo-300 font-mono-tech">{liveActualWeight || "0.00"} kg</strong></span>
                                                        <span className="bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 px-3 py-1 rounded-full font-bold font-mono-tech">Billed: {liveBilledWeight} kg</span>
                                                    </div>
                                                )}

                                                <div className="flex flex-col-reverse sm:flex-row justify-between gap-2">
                                                    <button type="button" onClick={() => setOrderStep(1)} className="bg-slate-800 hover:bg-slate-700 px-5 py-2.5 rounded-xl text-sm font-semibold">← Back</button>
                                                    <button type="button" onClick={() => {
                                                        if (!newOrder.length || !newOrder.breadth || !newOrder.height || !newOrder.actualWeight) {
                                                            return showToast("Enter package dimensions and actual weight.", "error");
                                                        }
                                                        setOrderStep(3);
                                                    }} className="bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 px-6 py-2.5 rounded-xl font-bold text-sm transition">
                                                        Next: Payment & Quote →
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {orderStep === 3 && (
                                            <div className="space-y-4 animate-float-in">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="space-y-2">
                                                        <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Shipment Tier</p>
                                                        <div className="grid grid-cols-2 gap-2.5">
                                                            {["B2C", "B2B"].map(type => (
                                                                <button key={type} type="button" onClick={() => { setNewOrder({...newOrder, orderType: type}); setQuote(null); }}
                                                                    className={`p-3.5 rounded-2xl border text-left transition ${newOrder.orderType === type ? "bg-indigo-500/20 border-indigo-400 text-white shadow-lg shadow-indigo-500/15" : "glass-subtle text-slate-400"}`}>
                                                                    <div className="font-bold text-sm">{type}</div>
                                                                    <div className="text-[11px] opacity-75 mt-0.5">{type === "B2C" ? "Standard Retail" : "Bulk Business Rate"}</div>
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                    <div className="space-y-2">
                                                        <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Payment Mode</p>
                                                        <div className="grid grid-cols-2 gap-2.5">
                                                            {["PREPAID", "COD"].map(pay => (
                                                                <button key={pay} type="button" onClick={() => { setNewOrder({...newOrder, paymentType: pay}); setQuote(null); }}
                                                                    className={`p-3.5 rounded-2xl border text-left transition ${newOrder.paymentType === pay ? "bg-emerald-500/20 border-emerald-400 text-white shadow-lg shadow-emerald-500/15" : "glass-subtle text-slate-400"}`}>
                                                                    <div className="font-bold text-sm">{pay}</div>
                                                                    <div className="text-[11px] opacity-75 mt-0.5">{pay === "PREPAID" ? "No extra surcharge" : "Includes COD surcharge"}</div>
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>

                                                {!quote ? (
                                                    <div className="flex flex-col-reverse sm:flex-row justify-between gap-2 pt-2">
                                                        <button type="button" onClick={() => setOrderStep(2)} className="bg-slate-800 hover:bg-slate-700 px-5 py-2.5 rounded-xl text-sm font-semibold">← Back</button>
                                                        <button type="button" onClick={previewCharge} className="bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 px-7 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-sky-500/25">
                                                            Calculate & Preview Quote
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <div className="p-4 sm:p-5 rounded-2xl bg-slate-950/90 border border-emerald-500/40 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 animate-float-in">
                                                        <div className="text-sm space-y-1">
                                                            <p className="text-sky-300 font-bold">Route: {quote.pickupZoneName} → {quote.dropZoneName}</p>
                                                            <p className="text-slate-300 text-xs">Volumetric: <strong className="font-mono-tech">{quote.volumetricWeight} kg</strong> • Billed: <strong className="font-mono-tech">{quote.chargeableWeight} kg</strong></p>
                                                            <p className="text-slate-300 text-xs">Base ₹{quote.baseCharge} + COD ₹{quote.codSurcharge} = <strong className="text-emerald-400 text-xl font-mono-tech ml-1">₹{quote.totalCharge}</strong></p>
                                                        </div>
                                                        <div className="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                                                            <button type="button" onClick={() => setQuote(null)} className="bg-slate-800 hover:bg-slate-700 px-4 py-2.5 rounded-xl text-sm font-semibold">Edit</button>
                                                            <button type="button" onClick={confirmOrder} className="bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 px-6 py-2.5 rounded-xl font-bold text-white shadow-lg shadow-emerald-500/25">
                                                                Confirm & Dispatch
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </TiltCard>
                                )}

                                {/* LIVE ORDER TRACKING TIMELINE WITH VISUAL STEPPER */}
                                {(user.role !== "ADMIN" || adminTab === "orders") && (
                                    <section className="glass p-5 sm:p-6 rounded-3xl space-y-5">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <div>
                                                <h2 className="text-lg sm:text-xl font-bold text-sky-300">Live Shipment Telemetry</h2>
                                                <p className="text-xs text-slate-400">Real-time checkpoint timeline & chain-of-custody logs</p>
                                            </div>
                                        </div>
                                        <div className="flex flex-col sm:flex-row gap-2.5">
                                            <input type="number" value={trackId} onChange={e => setTrackId(e.target.value)} placeholder="Enter Order ID to trace..." className="min-w-0 flex-1 font-mono-tech bg-slate-950/75 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white focus:border-sky-400 focus:outline-none" />
                                            <button onClick={() => trackOrder(trackId)} className="bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 px-6 py-2.5 rounded-xl font-bold shrink-0 shadow-lg shadow-sky-500/20">Trace Parcel</button>
                                        </div>

                                        {trackingHistory.length > 0 && (
                                            <div className="space-y-5 pt-2 animate-float-in">
                                                {/* Visual Milestone Stepper */}
                                                {latestStepIdx >= 0 && (
                                                    <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                                                        {TIMELINE_FLOW.map((step, idx) => {
                                                            const done = idx <= latestStepIdx;
                                                            const current = idx === latestStepIdx;
                                                            return (
                                                                <div key={step} className={`p-2.5 rounded-xl border text-center transition ${done ? "bg-sky-500/15 border-sky-400/40" : "bg-slate-950/50 border-slate-800/80 opacity-50"}`}>
                                                                    <div className={`w-2.5 h-2.5 rounded-full mx-auto mb-1.5 ${done ? "bg-sky-400" : "bg-slate-700"} ${current ? "pulse-node" : ""}`} />
                                                                    <div className={`text-[10px] font-bold tracking-wide ${done ? "text-sky-200" : "text-slate-500"}`}>{step.replaceAll("_", " ")}</div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}

                                                {/* Event Log */}
                                                <div className="space-y-2.5 border-l-2 border-sky-500/40 pl-4">
                                                    {trackingHistory.map(t => (
                                                        <div key={t.id} className="glass-subtle p-3.5 rounded-2xl flex flex-col sm:flex-row sm:justify-between gap-1 text-sm">
                                                            <span className="break-words">
                                                                <span className={`inline-block text-[11px] font-bold px-2 py-0.5 rounded-md border mr-2 ${STATUS_STYLES[t.status] || STATUS_STYLES.CREATED}`}>{t.status}</span>
                                                                <span className="text-slate-200">{t.remarks}</span>
                                                                <span className="text-slate-500 text-xs ml-1.5">(by {t.updatedBy})</span>
                                                            </span>
                                                            <span className="text-slate-400 text-xs font-mono-tech shrink-0">{new Date(t.timestamp).toLocaleString()}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </section>
                                )}

                                {/* ORDERS GRID */}
                                {(user.role !== "ADMIN" || adminTab === "orders") && (
                                    <section className="glass p-5 sm:p-6 rounded-3xl space-y-5">
                                        <div className="flex flex-wrap justify-between items-center gap-3">
                                            <div>
                                                <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                                                    <span>{user.role === "AGENT" ? "Active Delivery Queue" : user.role === "ADMIN" ? "All Network Shipments" : "My Shipments"}</span>
                                                    <span className="text-xs font-mono-tech bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 px-2.5 py-0.5 rounded-full">{visibleOrders.length}</span>
                                                </h2>
                                            </div>
                                            {user.role === "ADMIN" && (
                                                <div className="flex flex-wrap gap-2 text-xs w-full sm:w-auto">
                                                    <select value={filters.status} onChange={e => { const f = {...filters, status: e.target.value}; setFilters(f); loadOrders(authHeader, user.role, f); }} className="flex-1 sm:flex-none bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5">
                                                        <option value="">All Statuses</option>
                                                        {ALL_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                    <select value={filters.zoneId} onChange={e => { const f = {...filters, zoneId: e.target.value}; setFilters(f); loadOrders(authHeader, user.role, f); }} className="flex-1 sm:flex-none bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5">
                                                        <option value="">All Zones</option>
                                                        {zones.map(z => <option key={z.id} value={z.id}>{z.name}</option>)}
                                                    </select>
                                                    <select value={filters.agentId} onChange={e => { const f = {...filters, agentId: e.target.value}; setFilters(f); loadOrders(authHeader, user.role, f); }} className="flex-1 sm:flex-none bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5">
                                                        <option value="">All Agents</option>
                                                        {agents.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                                    </select>
                                                </div>
                                            )}
                                        </div>

                                        {visibleOrders.length === 0 ? (
                                            <div className="glass-subtle rounded-2xl p-8 text-center">
                                                <div className="text-3xl mb-2">📭</div>
                                                <p className="text-sm text-slate-400">
                                                    {user.role === "AGENT" ? "All caught up! No active deliveries pending." : "No shipments found yet."}
                                                </p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {visibleOrders.map(o => (
                                                    <div key={o.id} className="bg-slate-950/70 border border-slate-800/90 hover:border-sky-500/45 p-4 sm:p-5 rounded-2xl space-y-3 text-sm transition shadow-lg">
                                                        <div className="flex justify-between items-center gap-2">
                                                            <span className="font-bold text-base font-mono-tech text-white">#{o.orderNumber || o.id}</span>
                                                            <span className={`text-[11px] px-2.5 py-0.5 rounded-full border font-bold shrink-0 ${STATUS_STYLES[o.status] || STATUS_STYLES.CREATED}`}>
                                                                {o.status.replaceAll("_", " ")}
                                                            </span>
                                                        </div>

                                                        {/* Visual Route Connector */}
                                                        <div className="glass-subtle p-3 rounded-xl space-y-2 text-xs">
                                                            <div className="flex items-start gap-2">
                                                                <span className="w-2 h-2 rounded-full bg-sky-400 mt-1 shrink-0" />
                                                                <span className="text-slate-300 break-words">{o.pickupAddress} <span className="text-slate-500 font-mono-tech">({o.pickupPincode})</span></span>
                                                            </div>
                                                            <div className="ml-0.5 pl-3 border-l border-dashed border-slate-700 text-[10px] text-slate-500">🚚 In Route</div>
                                                            <div className="flex items-start gap-2">
                                                                <span className="w-2 h-2 rounded-full bg-emerald-400 mt-1 shrink-0" />
                                                                <span className="text-slate-300 break-words">{o.dropAddress} <span className="text-slate-500 font-mono-tech">({o.dropPincode})</span></span>
                                                            </div>
                                                        </div>

                                                        <div className="flex flex-wrap justify-between items-center text-xs text-slate-300 gap-1">
                                                            <span>{o.orderType} • {o.paymentType} • <span className="font-mono-tech">{o.chargeableWeight}kg</span></span>
                                                            <strong className="text-emerald-400 font-mono-tech text-sm">₹{o.totalCharge}</strong>
                                                        </div>

                                                        <div className="flex justify-between items-center text-xs pt-1">
                                                            <span className="text-slate-400">Agent: <span className="text-indigo-300 font-medium">{o.assignedAgent ? o.assignedAgent.name : "Unassigned"}</span></span>
                                                            <button onClick={() => trackOrder(o.id)} className="text-sky-400 hover:text-sky-300 font-semibold">Trace →</button>
                                                        </div>

                                                        {o.status === "FAILED" && (
                                                            <div className="pt-2.5 border-t border-slate-800 space-y-2">
                                                                <p className="text-xs text-rose-300 font-semibold">Delivery Failed — Reschedule:</p>
                                                                <input type="datetime-local" value={rescheduleDates[o.id] || ""} onChange={e => setRescheduleDates({...rescheduleDates, [o.id]: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs" />
                                                                <button onClick={() => rescheduleOrder(o.id)} className="w-full bg-amber-600 hover:bg-amber-500 py-1.5 rounded-lg text-xs font-bold">Reschedule & Reassign</button>
                                                            </div>
                                                        )}

                                                        {user.role === "AGENT" && o.status !== "DELIVERED" && (
                                                            <div className="pt-2.5 border-t border-slate-800 space-y-2">
                                                                <input value={statusRemarks[o.id] || ""} onChange={e => setStatusRemarks({...statusRemarks, [o.id]: e.target.value})} placeholder="Delivery remarks (optional)" className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs" />
                                                                <div className="flex flex-wrap gap-1.5">
                                                                    {AGENT_STATUSES.map(st => (
                                                                        <button key={st} onClick={() => st === "DELIVERED" ? sendDeliveryOtp(o.id) : updateStatus(o.id, st)}
                                                                            className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold transition ${st === "DELIVERED" ? "bg-emerald-600/90 hover:bg-emerald-500 text-white" : "bg-slate-800 hover:bg-sky-600 text-slate-200"}`}>
                                                                            {st === "DELIVERED" ? "DELIVERED (OTP)" : st.replaceAll("_", " ")}
                                                                        </button>
                                                                    ))}
                                                                </div>

                                                                {deliveryOtpOrderId === o.id && (
                                                                    <div className="mt-2 p-3 rounded-xl bg-slate-900/95 border border-emerald-500/40 space-y-2 animate-float-in">
                                                                        <div className="flex justify-between items-center text-[11px]">
                                                                            <span className="text-emerald-300 font-semibold">Customer Delivery OTP</span>
                                                                            <button type="button" onClick={() => sendDeliveryOtp(o.id)} className="text-sky-400 hover:underline">Resend</button>
                                                                        </div>
                                                                        <div className="flex gap-1.5">
                                                                            <input type="text" maxLength="6" value={deliveryOtpInput} onChange={e => setDeliveryOtpInput(e.target.value)} placeholder="6-digit OTP"
                                                                                className="min-w-0 flex-1 font-mono-tech bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-center tracking-widest font-bold" />
                                                                            <button type="button" onClick={() => verifyDeliveryOtp(o.id)} className="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-bold text-white shrink-0">
                                                                                Verify
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}

                                                        {user.role === "ADMIN" && (
                                                            <div className="pt-2.5 border-t border-slate-800 space-y-2">
                                                                <div className="flex gap-1.5">
                                                                    <select onChange={e => assignAgent(o.id, e.target.value)} defaultValue="" className="min-w-0 flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs">
                                                                        <option value="" disabled>Manual Assign...</option>
                                                                        {agents.map(a => <option key={a.id} value={a.id}>{a.name} ({a.isAvailable ? "Free" : "Busy"})</option>)}
                                                                    </select>
                                                                    <button onClick={() => autoAssign(o.id)} className="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg text-xs font-bold shrink-0">Auto</button>
                                                                </div>
                                                                <select onChange={e => updateStatus(o.id, e.target.value)} value={o.status} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs">
                                                                    {ALL_STATUSES.map(st => <option key={st} value={st}>Override: {st}</option>)}
                                                                </select>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </section>
                                )}
                            </main>
                        </div>
                    )}
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
