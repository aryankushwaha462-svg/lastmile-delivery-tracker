<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LastMileTracker — Smart Logistics Command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-deep: #050914;
            --accent-sky: #38bdf8;
            --accent-indigo: #818cf8;
            --accent-emerald: #34d399;
        }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
        @media (pointer: fine) {
            body, a, button, input, select { cursor: none; }
        }
        .glass {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.78), rgba(9, 14, 28, 0.88));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.14);
            box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        .glass-subtle {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }
        .tilt-card {
            transform-style: preserve-3d;
            transition: transform 0.16s ease-out, border-color 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .tilt-card:hover { border-color: rgba(56, 189, 248, 0.35); }
        .spotlight { pointer-events: none; position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s ease; }
        .tilt-card:hover .spotlight { opacity: 1; }
        #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* Ambient aurora glows */
        .aurora-1 {
            position: fixed; width: 560px; height: 560px; border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.16) 0%, transparent 70%);
            top: -180px; left: -140px; pointer-events: none; z-index: 0; filter: blur(48px);
            animation: driftA 16s ease-in-out infinite alternate;
        }
        .aurora-2 {
            position: fixed; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            bottom: -200px; right: -140px; pointer-events: none; z-index: 0; filter: blur(55px);
            animation: driftB 20s ease-in-out infinite alternate;
        }
        @keyframes driftA { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, 40px) scale(1.12); } }
        @keyframes driftB { from { transform: translate(0, 0) scale(1); } to { transform: translate(-60px, -40px) scale(1.1); } }

        /* Enhanced Custom Cursor (Desktop Only) */
        .cursor-dot {
            position: fixed; width: 7px; height: 7px; background: #38bdf8; border-radius: 50%;
            pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
            transition: transform 0.12s ease, background-color 0.15s ease;
            box-shadow: 0 0 14px #38bdf8, 0 0 28px rgba(56, 189, 248, 0.5);
        }
        .cursor-dot.hovering { transform: translate(-50%, -50%) scale(1.5); background: #34d399; box-shadow: 0 0 16px #34d399; }
        .cursor-dot.clicking { transform: translate(-50%, -50%) scale(2.1); background: #f472b6; }
        .cursor-ring {
            position: fixed; width: 34px; height: 34px; border: 1.5px solid rgba(56, 189, 248, 0.65);
            border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%);
            transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1), height 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .cursor-ring.scrolling { width: 54px; height: 22px; border-color: #818cf8; box-shadow: 0 0 24px rgba(129, 140, 248, 0.55); }
        .cursor-ring.hovering {
            width: 50px; height: 50px; border-color: #34d399;
            background-color: rgba(52, 211, 153, 0.06);
            box-shadow: 0 0 24px rgba(52, 211, 153, 0.45);
        }
        .cursor-ring.clicking { width: 22px; height: 22px; border-color: #f472b6; box-shadow: 0 0 28px rgba(244, 114, 182, 0.8); }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-float-in { animation: floatIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.45); }
            50% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
        }
        .pulse-node { animation: pulseGlow 2.2s infinite; }

        /* Sleek Scrollbar */
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #070b14; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body>
    <div class="aurora-1"></div>
    <div class="aurora-2"></div>
    <canvas id="bg-canvas"></canvas>
    <div id="root" class="relative z-10 min-h-screen overflow-x-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const ALL_STATUSES = ["CREATED", "ASSIGNED", "PICKED_UP", "IN_TRANSIT", "OUT_FOR_DELIVERY", "DELIVERED", "FAILED", "RESCHEDULED"];
        const AGENT_STATUSES = ["PICKED_UP", "IN_TRANSIT", "OUT_FOR_DELIVERY", "DELIVERED", "FAILED"];
        const TIMELINE_FLOW = ["CREATED", "ASSIGNED", "PICKED_UP", "IN_TRANSIT", "OUT_FOR_DELIVERY", "DELIVERED"];

        const STATUS_STYLES = {
            CREATED: "bg-slate-500/20 text-slate-300 border-slate-500/30",
            ASSIGNED: "bg-indigo-500/20 text-indigo-300 border-indigo-500/30",
            PICKED_UP: "bg-cyan-500/20 text-cyan-300 border-cyan-500/30",
            IN_TRANSIT: "bg-sky-500/20 text-sky-300 border-sky-500/30",
            OUT_FOR_DELIVERY: "bg-amber-500/20 text-amber-300 border-amber-500/30",
            DELIVERED: "bg-emerald-500/20 text-emerald-300 border-emerald-500/30",
            FAILED: "bg-rose-500/20 text-rose-300 border-rose-500/30",
            RESCHEDULED: "bg-purple-500/20 text-purple-300 border-purple-500/30"
        };

        /* Inline SVG Brand Emblem */
        function BrandLogo({ size = 34 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" className="shrink-0">
                    <defs>
                        <linearGradient id="lmtGrad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                            <stop stopColor="#38bdf8" />
                            <stop offset="0.55" stopColor="#6366f1" />
                            <stop offset="1" stopColor="#34d399" />
                        </linearGradient>
                    </defs>
                    <rect x="2" y="2" width="36" height="36" rx="11" fill="rgba(15,23,42,0.85)" stroke="url(#lmtGrad)" strokeWidth="1.8" />
                    <path d="M20 9L30 14.5V25.5L20 31L10 25.5V14.5L20 9Z" stroke="url(#lmtGrad)" strokeWidth="2" strokeLinejoin="round" />
                    <path d="M20 9V20M20 20L30 14.5M20 20L10 14.5" stroke="url(#lmtGrad)" strokeWidth="1.6" strokeLinecap="round" />
                    <circle cx="20" cy="20" r="2.6" fill="#38bdf8" />
                </svg>
            );
        }

        /* Interactive Logistics Radar, Magnetic Hubs & Touch-Friendly Canvas */
        function InteractiveBackground() {
            useEffect(() => {
                const canvas = document.getElementById("bg-canvas");
                const ctx = canvas.getContext("2d");
                const isFinePointer = window.matchMedia("(pointer: fine)").matches;
                let animId, scrollOffset = 0;
                let mouse = { x: -999, y: -999, active: false };
                const ripples = [];
                const packets = [];
                const trail = [];

                const resize = () => {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    canvas.width = window.innerWidth * dpr;
                    canvas.height = window.innerHeight * dpr;
                    canvas.style.width = `${window.innerWidth}px`;
                    canvas.style.height = `${window.innerHeight}px`;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                };
                resize();
                window.addEventListener("resize", resize);

                const onMouseMove = (e) => {
                    mouse = { x: e.clientX, y: e.clientY, active: true };
                    if (isFinePointer) {
                        trail.push({ x: e.clientX, y: e.clientY, alpha: 0.55, r: 2.4 });
                        if (trail.length > 16) trail.shift();
                    }
                };
                const onMouseLeave = () => { mouse.active = false; };
                const onScroll = () => { scrollOffset = window.scrollY; };
                const spawnRipple = (x, y) => {
                    ripples.push({ x, y, r: 8, alpha: 0.75 });
                    ripples.push({ x, y, r: 2, alpha: 0.45 });
                };
                const onClick = (e) => spawnRipple(e.clientX, e.clientY);
                const onTouchStart = (e) => {
                    if (e.touches && e.touches[0]) {
                        spawnRipple(e.touches[0].clientX, e.touches[0].clientY);
                    }
                };

                window.addEventListener("mousemove", onMouseMove);
                window.addEventListener("mouseleave", onMouseLeave);
                window.addEventListener("scroll", onScroll, { passive: true });
                window.addEventListener("click", onClick);
                window.addEventListener("touchstart", onTouchStart, { passive: true });

                const w = () => window.innerWidth;
                const h = () => window.innerHeight;
                const hubCount = w() < 640 ? 24 : 58;

                const hubs = Array.from({ length: hubCount }, (_, idx) => ({
                    x: Math.random() * w(),
                    y: Math.random() * h(),
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: (Math.random() - 0.5) * 0.45,
                    r: idx % 7 === 0 ? 3.2 : Math.random() * 1.6 + 1.1,
                    isMajor: idx % 7 === 0
                }));

                const drawGrid = () => {
                    const step = w() < 640 ? 56 : 64;
                    const offsetY = -(scrollOffset * 0.14) % step;
                    ctx.strokeStyle = "rgba(148, 163, 184, 0.035)";
                    ctx.lineWidth = 1;
                    for (let x = 0; x < w(); x += step) {
                        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h()); ctx.stroke();
                    }
                    for (let y = offsetY; y < h(); y += step) {
                        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w(), y); ctx.stroke();
                    }

                    // Illuminate radar grid intersections near desktop cursor
                    if (isFinePointer && mouse.active) {
                        const startX = Math.max(0, Math.floor((mouse.x - 190) / step) * step);
                        const endX = Math.min(w(), mouse.x + 190);
                        const startY = Math.max(offsetY, Math.floor((mouse.y - 190 - offsetY) / step) * step + offsetY);
                        const endY = Math.min(h(), mouse.y + 190);

                        for (let x = startX; x <= endX; x += step) {
                            for (let y = startY; y <= endY; y += step) {
                                const d = Math.hypot(x - mouse.x, y - mouse.y);
                                if (d < 180) {
                                    const intensity = 1 - d / 180;
                                    ctx.beginPath();
                                    ctx.arc(x, y, 1.8 * intensity + 0.6, 0, Math.PI * 2);
                                    ctx.fillStyle = `rgba(56, 189, 248, ${0.45 * intensity})`;
                                    ctx.fill();
                                }
                            }
                        }
                    }
                };

                const draw = () => {
                    ctx.clearRect(0, 0, w(), h());
                    drawGrid();

                    // Soft cursor radar aura (desktop only)
                    if (isFinePointer && mouse.active) {
                        const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 210);
                        grad.addColorStop(0, "rgba(56, 189, 248, 0.10)");
                        grad.addColorStop(0.5, "rgba(99, 102, 241, 0.04)");
                        grad.addColorStop(1, "rgba(0, 0, 0, 0)");
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(mouse.x, mouse.y, 210, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Cursor particle trail
                    for (let i = trail.length - 1; i >= 0; i--) {
                        const t = trail[i];
                        t.alpha -= 0.035;
                        t.r *= 0.95;
                        if (t.alpha <= 0) { trail.splice(i, 1); continue; }
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(56, 189, 248, ${t.alpha})`;
                        ctx.fill();
                    }

                    // Sonar click / touch ripples
                    for (let i = ripples.length - 1; i >= 0; i--) {
                        const rp = ripples[i];
                        rp.r += 4.2;
                        rp.alpha -= 0.017;
                        if (rp.alpha <= 0) { ripples.splice(i, 1); continue; }
                        ctx.beginPath();
                        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(56, 189, 248, ${rp.alpha})`;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }

                    // Hubs, magnetic pull & route connections
                    hubs.forEach((p, i) => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0 || p.x > w()) p.vx *= -1;
                        if (p.y < 0 || p.y > h()) p.vy *= -1;
                        const renderY = (p.y - scrollOffset * 0.16 + h() * 10) % h();

                        if (isFinePointer && mouse.active) {
                            const dx = mouse.x - p.x;
                            const dy = mouse.y - renderY;
                            const distM = Math.hypot(dx, dy);
                            if (distM < 185 && distM > 22) {
                                p.x += (dx / distM) * 0.35;
                                p.y += (dy / distM) * 0.35;
                                ctx.beginPath();
                                ctx.moveTo(p.x, renderY);
                                ctx.lineTo(mouse.x, mouse.y);
                                ctx.strokeStyle = `rgba(56, 189, 248, ${0.38 * (1 - distM / 185)})`;
                                ctx.lineWidth = 1.1;
                                ctx.stroke();
                            }
                        }

                        for (let j = i + 1; j < hubs.length; j++) {
                            const q = hubs[j];
                            const qY = (q.y - scrollOffset * 0.16 + h() * 10) % h();
                            const d = Math.hypot(p.x - q.x, renderY - qY);
                            if (d < 145) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, renderY);
                                ctx.lineTo(q.x, qY);
                                ctx.strokeStyle = `rgba(99, 102, 241, ${0.19 * (1 - d / 145)})`;
                                ctx.lineWidth = 1;
                                ctx.stroke();
                                if (packets.length < 22 && Math.random() < 0.003) {
                                    packets.push({ ax: p.x, ay: renderY, bx: q.x, by: qY, t: 0, speed: 0.016 + Math.random() * 0.02 });
                                }
                            }
                        }

                        ctx.beginPath();
                        ctx.arc(p.x, renderY, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = p.isMajor ? "rgba(52, 211, 153, 0.9)" : "rgba(56, 189, 248, 0.7)";
                        ctx.fill();
                        if (p.isMajor) {
                            ctx.beginPath();
                            ctx.arc(p.x, renderY, p.r + 4.5, 0, Math.PI * 2);
                            ctx.strokeStyle = "rgba(52, 211, 153, 0.28)";
                            ctx.stroke();
                        }
                    });

                    // Express dispatch pulses
                    for (let i = packets.length - 1; i >= 0; i--) {
                        const pk = packets[i];
                        pk.t += pk.speed;
                        if (pk.t >= 1) { packets.splice(i, 1); continue; }
                        const x = pk.ax + (pk.bx - pk.ax) * pk.t;
                        const y = pk.ay + (pk.by - pk.ay) * pk.t;
                        ctx.beginPath();
                        ctx.arc(x, y, 2.3, 0, Math.PI * 2);
                        ctx.fillStyle = "#38bdf8";
                        ctx.fill();
                    }

                    animId = requestAnimationFrame(draw);
                };
                draw();
                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener("resize", resize);
                    window.removeEventListener("mousemove", onMouseMove);
                    window.removeEventListener("mouseleave", onMouseLeave);
                    window.removeEventListener("scroll", onScroll);
                    window.removeEventListener("click", onClick);
                    window.removeEventListener("touchstart", onTouchStart);
                };
            }, []);
            return null;
        }

        /* Velocity-Aware Custom Cursor (Strictly Desktop) */
        function CustomCursor() {
            const dotRef = useRef(null), ringRef = useRef(null);
            const [isDesktop, setIsDesktop] = useState(false);
            const [scrolling, setScrolling] = useState(false);
            const [hovering, setHovering] = useState(false);
            const [clicking, setClicking] = useState(false);

            useEffect(() => {
                const finePointer = window.matchMedia("(pointer: fine)").matches;
                setIsDesktop(finePointer);
                if (!finePointer) return;

                let mouseX = -100, mouseY = -100, ringX = -100, ringY = -100, scrollTimer, raf;
                const onMove = (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    if (dotRef.current) {
                        dotRef.current.style.left = `${mouseX}px`;
                        dotRef.current.style.top = `${mouseY}px`;
                    }
                    setHovering(!!e.target.closest("button, a, input, select"));
                };
                const onScroll = () => {
                    setScrolling(true);
                    clearTimeout(scrollTimer);
                    scrollTimer = setTimeout(() => setScrolling(false), 180);
                };
                const onDown = () => setClicking(true);
                const onUp = () => setClicking(false);

                const animate = () => {
                    const dx = mouseX - ringX;
                    const dy = mouseY - ringY;
                    ringX += dx * 0.18;
                    ringY += dy * 0.18;
                    if (ringRef.current) {
                        ringRef.current.style.left = `${ringX}px`;
                        ringRef.current.style.top = `${ringY}px`;
                    }
                    raf = requestAnimationFrame(animate);
                };

                window.addEventListener("mousemove", onMove);
                window.addEventListener("scroll", onScroll, { passive: true });
                window.addEventListener("mousedown", onDown);
                window.addEventListener("mouseup", onUp);
                animate();
                return () => {
                    cancelAnimationFrame(raf);
                    window.removeEventListener("mousemove", onMove);
                    window.removeEventListener("scroll", onScroll);
                    window.removeEventListener("mousedown", onDown);
                    window.removeEventListener("mouseup", onUp);
                };
            }, []);

            if (!isDesktop) return null;
            return (
                <>
                    <div ref={dotRef} className={`cursor-dot ${hovering ? "hovering" : ""} ${clicking ? "clicking" : ""}`} />
                    <div ref={ringRef} className={`cursor-ring ${scrolling ? "scrolling" : ""} ${hovering ? "hovering" : ""} ${clicking ? "clicking" : ""}`} />
                </>
            );
        }

        function TiltCard({ children, className = "" }) {
            const cardRef = useRef(null);
            const [spot, setSpot] = useState({ x: 50, y: 50 });
            const handleMove = (e) => {
                if (!window.matchMedia("(pointer: fine)").matches) return;
                const rect = cardRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                cardRef.current.style.transform = `perspective(1000px) rotateX(${((y / rect.height) - 0.5) * -3.5}deg) rotateY(${((x / rect.width) - 0.5) * 3.5}deg)`;
                setSpot({ x, y });
            };
            const handleLeave = () => { cardRef.current.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg)"; };
            return (
                <div ref={cardRef} onMouseMove={handleMove} onMouseLeave={handleLeave} className={`glass tilt-card ${className}`}>
                    <div className="spotlight" style={{ background: `radial-gradient(340px circle at ${spot.x}px ${spot.y}px, rgba(56, 189, 248, 0.14), transparent 70%)` }} />
                    <div className="relative z-10">{children}</div>
                </div>
            );
        }

        function App() {
            const emptyOrder = {
                pickupAddress: "", pickupPincode: "",
                dropAddress: "", dropPincode: "",
                length: "", breadth: "", height: "", actualWeight: "",
                orderType: "B2C", paymentType: "PREPAID", customerEmail: ""
            };

            const [authHeader, setAuthHeader] = useState(null);
            const [user, setUser] = useState(null);
            const [authChecking, setAuthChecking] = useState(true);
            const [isRegister, setIsRegister] = useState(false);
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [otp, setOtp] = useState("");
            const [otpSent, setOtpSent] = useState(false);
            const [resendCooldown, setResendCooldown] = useState(0);
            const [showPassword, setShowPassword] = useState(false);

            // Forgot Password state
            const [isForgotPassword, setIsForgotPassword] = useState(false);
            const [resetOtpSent, setResetOtpSent] = useState(false);
            const [resetOtp, setResetOtp] = useState("");
            const [newPassword, setNewPassword] = useState("");
            const [resetCooldown, setResetCooldown] = useState(0);

            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);

            // Orders & Tracking
            const [orders, setOrders] = useState([]);
            const [trackId, setTrackId] = useState("");
            const [trackingHistory, setTrackingHistory] = useState([]);
            const [rescheduleDates, setRescheduleDates] = useState({});
            const [statusRemarks, setStatusRemarks] = useState({});
            const [deliveryOtpOrderId, setDeliveryOtpOrderId] = useState(null);
            const [deliveryOtpInput, setDeliveryOtpInput] = useState("");

            // Interactive 3-Step Order Wizard
            const [orderStep, setOrderStep] = useState(1);
            const [quote, setQuote] = useState(null);
            const [newOrder, setNewOrder] = useState(emptyOrder);

            // Admin Data & Filters
            const [zones, setZones] = useState([]);
            const [areas, setAreas] = useState([]);
            const [agents, setAgents] = useState([]);
            const [rateCards, setRateCards] = useState([]);
            const [filters, setFilters] = useState({ status: "", zoneId: "", agentId: "" });
            const [newZoneName, setNewZoneName] = useState("");
            const [newArea, setNewArea] = useState({ pincode: "", areaName: "", zoneId: "" });
            const [newRate, setNewRate] = useState({ originZoneId: "", destinationZoneId: "", orderType: "B2C", baseRatePerKg: "", codSurcharge: "" });
            const [newAgent, setNewAgent] = useState({
                name: "", email: "", password: "", phone: "", vehicleType: "BIKE", vehicleNumber: "", zoneId: ""
            });
            const [adminTab, setAdminTab] = useState("orders");

            // Agent Profile state
            const [agentProfile, setAgentProfile] = useState(null);
            const [editingProfile, setEditingProfile] = useState(false);
            const [profileForm, setProfileForm] = useState({ name: "", phone: "", vehicleType: "BIKE", vehicleNumber: "" });

            useEffect(() => {
                const savedHeader = localStorage.getItem("lmt_auth");
                if (!savedHeader) {
                    setAuthChecking(false);
                    return;
                }
                fetch("/api/auth/me", { headers: { Authorization: savedHeader } })
                    .then(res => (res.ok ? res.json() : Promise.reject()))
                    .then(data => {
                        setAuthHeader(savedHeader);
                        setUser(data);
                        loadOrders(savedHeader, data.role, filters);
                        if (data.role === "ADMIN") loadAdminData(savedHeader);
                        if (data.role === "AGENT") loadAgentProfile(savedHeader);
                    })
                    .catch(() => localStorage.removeItem("lmt_auth"))
                    .finally(() => setAuthChecking(false));
            }, []);

            useEffect(() => {
                if (resendCooldown <= 0) return;
                const timer = setTimeout(() => setResendCooldown(c => c - 1), 1000);
                return () => clearTimeout(timer);
            }, [resendCooldown]);

            useEffect(() => {
                if (resetCooldown <= 0) return;
                const timer = setTimeout(() => setResetCooldown(c => c - 1), 1000);
                return () => clearTimeout(timer);
            }, [resetCooldown]);

            const liveVolWeight = (parseFloat(newOrder.length) > 0 && parseFloat(newOrder.breadth) > 0 && parseFloat(newOrder.height) > 0)
                ? ((parseFloat(newOrder.length) * parseFloat(newOrder.breadth) * parseFloat(newOrder.height)) / 5000).toFixed(2)
                : null;
            const liveActualWeight = parseFloat(newOrder.actualWeight) > 0 ? parseFloat(newOrder.actualWeight).toFixed(2) : null;
            const liveBilledWeight = (liveVolWeight || liveActualWeight)
                ? Math.max(parseFloat(liveVolWeight || 0), parseFloat(liveActualWeight || 0)).toFixed(2)
                : null;

            const showToast = (text, type = "info") => {
                setToast({ text, type });
                setTimeout(() => setToast(null), 4000);
            };

            const resetForgotState = () => {
                setIsForgotPassword(false);
                setResetOtpSent(false);
                setResetCooldown(0);
                setResetOtp("");
                setNewPassword("");
            };

            const handleSendResetOtp = async () => {
                if (!email.trim()) return showToast("Enter your email first.", "error");
                if (resetCooldown > 0 || loading) return;
                setLoading(true);
                try {
                    const res = await fetch("/api/auth/forgot-password", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email })
                    });
                    const msg = await res.text();
                    if (res.ok) {
                        setResetOtpSent(true);
                        setResetCooldown(30);
                        showToast(msg, "success");
                    } else showToast(msg, "error");
                } catch (err) {
                    showToast("Network error. Please try again.", "error");
                } finally { setLoading(false); }
            };

            const handleResetPassword = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const res = await fetch("/api/auth/reset-password", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, otp: resetOtp, newPassword })
                    });
                    const msg = await res.text();
                    if (res.ok) {
                        showToast(msg, "success");
                        resetForgotState();
                        setPassword("");
                    } else showToast(msg, "error");
                } catch (err) {
                    showToast("Network error. Please try again.", "error");
                } finally { setLoading(false); }
            };

            const handleResendOtp = async () => {
                if (resendCooldown > 0 || loading) return;
                setLoading(true);
                try {
                    const res = await fetch("/api/auth/send-otp", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email })
                    });
                    if (res.ok) {
                        setResendCooldown(30);
                        showToast("A new OTP has been sent to your email.", "success");
                    } else showToast(await res.text(), "error");
                } catch (err) {
                    showToast("Network error. Please try again.", "error");
                } finally { setLoading(false); }
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (isRegister) {
                        if (!otpSent) {
                            const res = await fetch("/api/auth/send-otp", {
                                method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ email })
                            });
                            if (res.ok) { setOtpSent(true); setResendCooldown(30); showToast(await res.text(), "success"); }
                            else showToast(await res.text(), "error");
                            return;
                        }
                        const res = await fetch("/api/auth/register", {
                            method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ email, password, otp })
                        });
                        if (res.ok) {
                            showToast("Account verified & created! Sign in now.", "success");
                            setIsRegister(false); setOtpSent(false); setResendCooldown(0); setEmail(""); setOtp(""); setPassword("");
                        } else showToast(await res.text(), "error");
                        return;
                    }

                    const header = "Basic " + btoa(`${email}:${password}`);
                    const res = await fetch("/api/auth/me", { headers: { Authorization: header } });
                    if (res.ok) {
                        const data = await res.json();
                        setAuthHeader(header); setUser(data);
                        localStorage.setItem("lmt_auth", header);
                        showToast(`Welcome, ${data.email}`, "success");
                        loadOrders(header, data.role, filters);
                        if (data.role === "ADMIN") loadAdminData(header);
                        if (data.role === "AGENT") loadAgentProfile(header);
                    } else showToast("Invalid email or password.", "error");
                } finally { setLoading(false); }
            };

            const loadOrders = async (header, role, activeFilters = filters) => {
                let url = role === "AGENT" ? "/api/agent/orders" : "/api/orders";
                if (role === "ADMIN") {
                    const params = new URLSearchParams();
                    if (activeFilters.status) params.append("status", activeFilters.status);
                    if (activeFilters.zoneId) params.append("zoneId", activeFilters.zoneId);
                    if (activeFilters.agentId) params.append("agentId", activeFilters.agentId);
                    if (params.toString()) url += `?${params.toString()}`;
                }
                const res = await fetch(url, { headers: { Authorization: header } });
                if (res.ok) setOrders(await res.json());
            };

            const loadAdminData = async (header) => {
                const [zRes, aRes, agRes, rRes] = await Promise.all([
                    fetch("/api/admin/zones", { headers: { Authorization: header } }),
                    fetch("/api/admin/areas", { headers: { Authorization: header } }),
                    fetch("/api/admin/agents", { headers: { Authorization: header } }),
                    fetch("/api/rate-cards", { headers: { Authorization: header } })
                ]);
                if (zRes.ok) setZones(await zRes.json());
                if (aRes.ok) setAreas(await aRes.json());
                if (agRes.ok) setAgents(await agRes.json());
                if (rRes.ok) setRateCards(await rRes.json());
            };

            const loadAgentProfile = async (header) => {
                const res = await fetch("/api/agent/profile", { headers: { Authorization: header } });
                if (res.ok) {
                    const data = await res.json();
                    setAgentProfile(data);
                    setProfileForm({
                        name: data.name || "",
                        phone: data.phone || "",
                        vehicleType: data.vehicleType || "BIKE",
                        vehicleNumber: data.vehicleNumber || ""
                    });
                }
            };

            const toggleAvailability = async () => {
                if (!agentProfile) return;
                const res = await fetch("/api/agent/availability", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json", Authorization: authHeader },
                    body: JSON.stringify({ isAvailable: !agentProfile.isAvailable })
                });
                if (res.ok) {
                    const data = await res.json();
                    setAgentProfile(prev => ({ ...prev, isAvailable: data.isAvailable }));
                    showToast(data.isAvailable ? "You are now ONLINE for deliveries." : "You are now OFFLINE.", "success");
                }
            };

            const saveAgentProfile = async (e) => {
                e.preventDefault();
                const res = await fetch("/api/agent/profile", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json", Authorization: authHeader },
                    body: JSON.stringify(profileForm)
                });
                if (res.ok) {
                    showToast("Profile updated!", "success");
                    setEditingProfile(false);
                    loadAgentProfile(authHeader);
                } else showToast("Failed to update profile.", "error");
            };

            const buildOrderPayload = () => ({
                ...newOrder,
                length: parseFloat(newOrder.length),
                breadth: parseFloat(newOrder.breadth),
                height: parseFloat(newOrder.height),
                actualWeight: parseFloat(newOrder.actualWeight),
                customerEmail: user.role === "ADMIN" && newOrder.customerEmail ? newOrder.customerEmail : user.email
            });

            const previewCharge = async () => {
                const res = await fetch("/api/orders/calculate-charge", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: authHeader },
                    body: JSON.stringify(buildOrderPayload())
                });
                if (res.ok) {
                    setQuote(await res.json());
                    showToast("Live quote ready! Confirm to place your order.", "success");
                } else showToast("Failed to calculate charge. Check dimensions & pincodes.", "error");
            };

            const confirmOrder = async () => {
                const res = await fetch("/api/orders", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: authHeader },
                    body: JSON.stringify(buildOrderPayload())
                });
                if (res.ok) {
                    const created = await res.json();
                    setQuote(null);
                    setNewOrder(emptyOrder);
                    setOrderStep(1);
                    showToast(`Order #${created.orderNumber || created.id} confirmed! Total: ₹${created.totalCharge}`, "success");
                    loadOrders(authHeader, user.role);
                    if (user.role === "ADMIN") loadAdminData(authHeader);
                } else showToast("Order creation failed.", "error");
            };

            const updateStatus = async (orderId, status) => {
                const remark = encodeURIComponent(statusRemarks[orderId] || `Updated to ${status}`);
                const res = await fetch(`/api/orders/${orderId}/status?status=${status}&remarks=${remark}`, {
                    method: "PATCH", headers: { Authorization: authHeader }
                });
                if (res.ok) {
                    showToast(`Order #${orderId} → ${status}`, "success");
                    loadOrders(authHeader, user.role);
                    if (user.role === "ADMIN") loadAdminData(authHeader);
                    if (user.role === "AGENT") loadAgentProfile(authHeader);
                }
            };

            const sendDeliveryOtp = async (orderId) => {
                setDeliveryOtpOrderId(orderId);
                setDeliveryOtpInput("");
                const res = await fetch(`/api/orders/${orderId}/send-delivery-otp`, {
                    method: "POST",
                    headers: { Authorization: authHeader }
                });
                const msg = await res.text();
                showToast(msg, res.ok ? "success" : "error");
            };

            const verifyDeliveryOtp = async (orderId) => {
                if (!deliveryOtpInput.trim()) return showToast("Enter the 6-digit OTP from the customer.", "error");
                const res = await fetch(`/api/orders/${orderId}/verify-delivery-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: authHeader },
                    body: JSON.stringify({
                        otp: deliveryOtpInput.trim(),
                        remarks: statusRemarks[orderId] || "Delivered (OTP Verified)"
                    })
                });
                const msg = await res.text();
                if (res.ok) {
                    showToast(msg, "success");
                    setDeliveryOtpOrderId(null);
                    setDeliveryOtpInput("");
                    loadOrders(authHeader, user.role);
                    if (user.role === "AGENT") loadAgentProfile(authHeader);
                } else showToast(msg, "error");
            };

            const assignAgent = async (orderId, agentId) => {
                if (!agentId) return;
                const res = await fetch(`/api/orders/${orderId}/assign-agent?agentId=${agentId}`, {
                    method: "PATCH", headers: { Authorization: authHeader }
                });
                if (res.ok) {
                    showToast(`Agent assigned to Order #${orderId}`, "success");
                    loadOrders(authHeader, user.role);
                    loadAdminData(authHeader);
                }
            };

            const autoAssign = async (orderId) => {
                const res = await fetch(`/api/orders/${orderId}/auto-assign`, {
                    method: "POST", headers: { Authorization: authHeader }
                });
                if (res.ok) {
                    showToast(`Auto-assigned nearest agent to Order #${orderId}`, "success");
                    loadOrders(authHeader, user.role);
                    loadAdminData(authHeader);
                } else showToast("No available agent in pickup zone right now.", "error");
            };

            const rescheduleOrder = async (orderId) => {
                const dt = rescheduleDates[orderId];
                if (!dt) return showToast("Select a new delivery date & time first.", "error");
                const isoDate = dt.length === 16 ? `${dt}:00` : dt;
                const res = await fetch(`/api/orders/${orderId}/reschedule?newDate=${encodeURIComponent(isoDate)}`, {
                    method: "POST", headers: { Authorization: authHeader }
                });
                if (res.ok) {
                    showToast(`Order #${orderId} rescheduled & agent reassigned!`, "success");
                    loadOrders(authHeader, user.role);
                } else showToast("Could not reschedule order.", "error");
            };

            const trackOrder = async (idToTrack = trackId) => {
                if (!idToTrack) return;
                setTrackId(idToTrack);
                const res = await fetch(`/api/orders/${idToTrack}/tracking`, { headers: { Authorization: authHeader } });
                if (res.ok) {
                    const data = await res.json();
                    setTrackingHistory(data);
                    if (data.length === 0) showToast("No tracking history found.", "error");
                } else if (res.status === 403) {
                    setTrackingHistory([]);
                    showToast("Access denied: You can only track your own orders.", "error");
                } else {
                    setTrackingHistory([]);
                    showToast("Order not found.", "error");
                }
            };

            const createZone = async (e) => {
                e.preventDefault();
                const res = await fetch("/api/admin/zones", {
                    method: "POST", headers: { "Content-Type": "application/json", Authorization: authHeader },
                    body: JSON.stringify({ name: newZoneName })
                });
                if (res.ok) { setNewZoneName(""); showToast("Zone created!", "success"); loadAdminData(authHeader); }
            };

            const createArea = async (e) => {
                e.preventDefault();
                const res = await fetch("/api/admin/areas", {
                    method: "POST", headers: { "Content-Type": "application/json", Authorization: authHeader },
                    body: JSON.stringify(newArea)
                });
                if (res.ok) { setNewArea({ pincode: "", areaName: "", zoneId: "" }); showToast("Area assigned to zone!", "success"); loadAdminData(authHeader); }
            };

            const saveRateCard = async (e) => {
                e.preventDefault();
                const res = await fetch("/api/rate-cards", {
                    method: "POST", headers: { "Content-Type": "application/json", Authorization: authHeader },
                    body: JSON.stringify(newRate)
                });
                if (res.ok) {
                    setNewRate({ originZoneId: "", destinationZoneId: "", orderType: "B2C", baseRatePerKg: "", codSurcharge: "" });
                    showToast("Rate card saved!", "success");
                    loadAdminData(authHeader);
                }
            };

            const createAgent = async (e) => {
                e.preventDefault();
                const res = await fetch("/api/admin/agents", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: authHeader },
                    body: JSON.stringify(newAgent)
                });
                const msg = await res.text();
                if (res.ok) {
                    setNewAgent({ name: "", email: "", password: "", phone: "", vehicleType: "BIKE", vehicleNumber: "", zoneId: "" });
                    showToast(msg, "success");
                    loadAdminData(authHeader);
                } else showToast(msg, "error");
            };

            const logout = () => {
                localStorage.removeItem("lmt_auth");
                setAuthHeader(null); setUser(null); setOrders([]); setTrackingHistory([]); setQuote(null);
                setNewOrder(emptyOrder); setOrderStep(1); setEmail(""); setPassword(""); setOtp(""); setOtpSent(false); setResendCooldown(0);
                setAgentProfile(null); setEditingProfile(false);
                setDeliveryOtpOrderId(null); setDeliveryOtpInput("");
                resetForgotState();
            };

            const visibleOrders = user?.role === "AGENT"
                ? orders.filter(o => o.status !== "DELIVERED")
                : orders;

            // Command Center KPI stats
            const deliveredCount = orders.filter(o => o.status === "DELIVERED").length;
            const inTransitCount = orders.filter(o => ["PICKED_UP", "IN_TRANSIT", "OUT_FOR_DELIVERY"].includes(o.status)).length;
            const totalValue = orders.reduce((acc, o) => acc + (parseFloat(o.totalCharge) || 0), 0);

            // Latest tracked status for visual progress stepper
            const latestTrackedStatus = trackingHistory.length > 0 ? trackingHistory[trackingHistory.length - 1].status : null;
            const latestStepIdx = latestTrackedStatus ? TIMELINE_FLOW.indexOf(latestTrackedStatus) : -1;

            if (authChecking) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gap-3 text-sky-400">
                        <BrandLogo size={46} />
                        <p className="text-sm font-semibold tracking-wide animate-pulse">Connecting to LastMileTracker Network...</p>
                    </div>
                );
            }

            return (
                <>
                    <InteractiveBackground />
                    <CustomCursor />

                    {toast && (
                        <div className={`fixed top-4 left-4 right-4 sm:left-auto sm:right-5 sm:max-w-sm z-50 px-4 sm:px-5 py-3.5 rounded-2xl shadow-2xl border backdrop-blur-xl text-sm font-medium animate-float-in flex items-center gap-2.5 ${
                            toast.type === "error" ? "bg-rose-950/90 border-rose-500/40 text-rose-100" : "bg-emerald-950/90 border-emerald-500/40 text-emerald-100"
                        }`}>
                            <span className={`w-2 h-2 rounded-full shrink-0 ${toast.type === "error" ? "bg-rose-400" : "bg-emerald-400"}`} />
                            <span>{toast.text}</span>
                        </div>
                    )}

                    {!user ? (
                        <div className="min-h-screen flex items-center justify-center px-4 py-10">
                            <div className="w-full max-w-md space-y-5 animate-float-in">
                                <div className="flex justify-center">
                                    <span className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-[11px] font-semibold tracking-wider uppercase bg-sky-500/10 border border-sky-400/25 text-sky-300">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 pulse-node"></span>
                                        Live Last-Mile Dispatch Network
                                    </span>
                                </div>

                                <TiltCard className="p-6 sm:p-8 rounded-3xl shadow-2xl">
                                    <div className="flex flex-col items-center text-center mb-6 sm:mb-7">
                                        <BrandLogo size={48} />
                                        <h1 className="text-2xl sm:text-3xl font-extrabold mt-3 text-transparent bg-clip-text bg-gradient-to-r from-sky-300 via-blue-400 to-indigo-400 tracking-tight">
                                            LastMileTracker
                                        </h1>
                                        <p className="text-slate-400 text-sm mt-1">
                                            {isForgotPassword ? "Reset your account password via OTP" : isRegister ? "Create your Logistics Account" : "Sign in to your Logistics Command Portal"}
                                        </p>
                                    </div>

                                    {isForgotPassword ? (
                                        <form onSubmit={handleResetPassword} autoComplete="off" className="space-y-4 animate-float-in">
                                            <div>
                                                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} disabled={resetOtpSent} placeholder="Enter your registered email"
                                                    className="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 transition disabled:opacity-60" required />
                                            </div>

                                            {!resetOtpSent ? (
                                                <button type="button" onClick={handleSendResetOtp} disabled={loading || resetCooldown > 0}
                                                    className="w-full mt-2 bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-white font-bold py-3 rounded-xl shadow-lg shadow-sky-500/20 transition disabled:opacity-60">
                                                    {loading ? "Processing..." : resetCooldown > 0 ? `Send Reset OTP (${resetCooldown}s)` : "Send Reset OTP"}
                                                </button>
                                            ) : (
                                                <>
                                                    <div className="animate-float-in">
                                                        <label className="block text-xs font-semibold uppercase tracking-wider text-sky-400 mb-1.5">6-Digit Reset OTP</label>
                                                        <input type="text" maxLength="6" value={resetOtp} onChange={e => setResetOtp(e.target.value)} placeholder="••••••"
                                                            className="w-full font-mono-tech bg-slate-950/70 border border-sky-500/60 rounded-xl px-4 py-3 text-white text-center tracking-[0.4em] font-bold" required />
                                                        <div className="flex justify-between items-center mt-2 text-xs">
                                                            <span className="text-slate-400">Didn't receive the OTP?</span>
                                                            <button type="button" onClick={handleSendResetOtp} disabled={resetCooldown > 0 || loading}
                                                                className="text-sky-400 hover:text-sky-300 font-semibold disabled:text-slate-500 transition">
                                                                {resetCooldown > 0 ? `Resend in ${resetCooldown}s` : "Resend OTP"}
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">New Password</label>
                                                        <div className="relative">
                                                            <input type={showPassword ? "text" : "password"} value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="Enter new password"
                                                                className="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-3 pr-14 text-white focus:outline-none focus:border-sky-400 transition" required />
                                                            <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-sky-400 font-semibold">
                                                                {showPassword ? "HIDE" : "SHOW"}
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <button type="submit" disabled={loading}
                                                        className="w-full mt-2 bg-gradient-to-r from-emerald-500 to-sky-500 hover:from-emerald-400 hover:to-sky-400 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/20 transition disabled:opacity-60">
                                                        {loading ? "Resetting..." : "Reset Password"}
                                                    </button>
                                                </>
                                            )}

                                            <button type="button" onClick={() => { resetForgotState(); setPassword(""); }} className="w-full mt-3 text-sm text-sky-400 hover:text-sky-300">
                                                ← Back to Sign In
                                            </button>
                                        </form>
                                    ) : (
                                        <>
                                            <form onSubmit={handleAuth} autoComplete="off" className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                                                    <input type="email" value={email} onChange={e => setEmail(e.target.value)} disabled={isRegister && otpSent} placeholder="name@company.com"
                                                        className="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 transition disabled:opacity-60" required />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                                                    <div className="relative">
                                                        <input type={showPassword ? "text" : "password"} value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••"
                                                            className="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-3 pr-14 text-white focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 transition" required />
                                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-sky-400 font-semibold">
                                                            {showPassword ? "HIDE" : "SHOW"}
                                                        </button>
                                                    </div>
                                                    {!isRegister && (
                                                        <div className="flex justify-end mt-1.5">
                                                            <button type="button" onClick={() => { resetForgotState(); setIsForgotPassword(true); }} className="text-xs text-sky-400 hover:text-sky-300 font-semibold">
                                                                Forgot password?
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                                {isRegister && otpSent && (
                                                    <div className="animate-float-in">

                                                        <input type="text" maxLength="6" value={otp} onChange={e => setOtp(e.target.value)} placeholder="••••••"
